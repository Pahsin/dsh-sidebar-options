<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向 A · 深色电影感</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; padding: 32px 28px;
    background:
      radial-gradient(120% 90% at 18% 8%, rgba(84, 122, 214, .32) 0%, rgba(10, 14, 24, 0) 58%),
      radial-gradient(90% 70% at 82% 100%, rgba(201, 160, 92, .16) 0%, rgba(10, 14, 24, 0) 62%),
      linear-gradient(170deg, #10172a 0%, #080b14 46%, #05070c 100%);
    color: #eef2fb;
    font: 400 14px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage { width: min(100%, 620px); }
  .rule { display: flex; align-items: center; gap: 10px; color: #c9a05c; font-size: 10px; letter-spacing: .34em; text-transform: uppercase; }
  .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201, 160, 92, .55), rgba(201, 160, 92, 0)); }
  h1 { margin: 18px 0 0; font-size: clamp(26px, 6vw, 40px); line-height: 1.12; font-weight: 300; letter-spacing: -.015em; }
  h1 b { font-weight: 650; }
  .sub { margin-top: 14px; max-width: 30em; color: #9daac6; font-size: 13px; }
  .frame { margin-top: 26px; border: 1px solid rgba(150, 180, 255, .2); border-radius: 3px; padding: 14px 16px; background: linear-gradient(180deg, rgba(22, 32, 54, .62), rgba(9, 13, 22, .62)); backdrop-filter: blur(2px); }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: #8290ad; font-variant-numeric: tabular-nums; }
  .row + .row { margin-top: 7px; }
  .row em { font-style: normal; color: #dce6ff; }
  .bar { margin-top: 16px; height: 2px; background: rgba(150, 180, 255, .16); position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 64%; background: linear-gradient(90deg, #3c6fd4, #8fd0ff); }
  .caption { margin-top: 22px; color: #6d7a95; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
</style>
</head>
<body>
  <main class="stage">
    <div class="rule">Direction A — 夜戏 · 电影感</div>
    <h1>把情绪压在<b>暗部</b>，<br />让一束冷光说话。</h1>
    <p class="sub">低饱和墨蓝底、单侧冷光、金色细线做标尺。适合夜间叙事与情绪片头，画面越暗，字越要瘦。</p>
    <section class="frame">
      <div class="row"><span>色板 / PALETTE</span><em>#10172A · #080B14 · #C9A05C</em></div>
      <div class="row"><span>字重 / WEIGHT</span><em>300 / 650</em></div>
      <div class="row"><span>节奏 / RHYTHM</span><em>慢 · 0.8s 入场</em></div>
      <div class="bar"><i></i></div>
    </section>
    <p class="caption">这是选项 A 的结果长什么样 · sample-a-dark</p>
  </main>
</body>
</html>
